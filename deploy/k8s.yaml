apiVersion: apps/v1
kind: Deployment
metadata: { name: nmapdiff, labels: { app: nmapdiff } }
spec:
  replicas: 1
  selector: { matchLabels: { app: nmapdiff } }
  template:
    metadata: { labels: { app: nmapdiff } }
    spec:
      containers:
        - name: nmapdiff
          image: ghcr.io/cognis-digital/nmapdiff:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: nmapdiff }
spec:
  selector: { app: nmapdiff }
  ports: [{ port: 80, targetPort: 8000 }]
